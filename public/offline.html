<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#143B63">
  <title>Sin conexión — Expoferia de Nutrición Animal 2026 | SIPA</title>
  <script>
    (() => {
      const root = document.documentElement;
      let theme = 'light';
      try {
        const saved = localStorage.getItem('sipa-expoferia-theme');
        theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#07141F' : '#143B63');
    })();
  </script>
  <style>
    :root {
      --background: #FFFDF7;
      --surface: #FFFFFF;
      --text: #263746;
      --text-soft: #526575;
      --heading: #143B63;
      --icon-bg: #DCEFF8;
      --icon: #3478A8;
      --button: #47743A;
      --button-hover: #315E35;
      --focus: #256F9F;
      --border: #D8E1E6;
      --shadow: rgba(20, 59, 99, 0.14);
    }
    :root[data-theme='dark'] {
      --background: #07141F;
      --surface: #0E2231;
      --text: #EAF2F5;
      --text-soft: #B5C6CF;
      --heading: #F5FBFD;
      --icon-bg: #17364A;
      --icon: #73B6DD;
      --button: #8EBD79;
      --button-hover: #AED29D;
      --focus: #92CCF0;
      --border: #294354;
      --shadow: rgba(0, 0, 0, 0.32);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .offline-container {
      max-width: 480px;
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 36px var(--shadow);
    }
    .offline-icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      background: var(--icon-bg); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .offline-icon svg { width: 40px; height: 40px; fill: var(--icon); }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: var(--heading); }
    p { font-size: 1rem; line-height: 1.6; color: var(--text-soft); margin-bottom: 1rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0.75rem 1.5rem;
      background: var(--button); color: #07141F; border: none; border-radius: 8px;
      font-size: 1rem; cursor: pointer; text-decoration: none;
      font-weight: 700;
      transition: background-color 0.2s, color 0.2s;
    }
    :root[data-theme='light'] .btn { color: #FFFFFF; }
    .btn:hover { background: var(--button-hover); }
    .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 .01c0-.01-6.99-.01-6.99-.01s-1.53 1.53-2.12 2.12L19.17 6.4l-1.42 1.41L13.41 3.5 11.29 5.62l4.24 4.24-1.41 1.42-4.25-4.24-2.12 2.12 4.24 4.24-1.41 1.41-4.24-4.24L2.4 14.82l4.24 4.24-1.41 1.41L1 16.23 0 17.23 6.77 24H24V.01zM2 0L0 2l4.05 4.05C2.59 6.83 1.33 7.88 0 9.02l2.12 2.12c1.13-.96 2.42-1.81 3.8-2.45L8.08 10.85c-1.08.49-2.1 1.12-3.03 1.86l2.12 2.12c.8-.6 1.64-1.1 2.54-1.49l2.16 2.16c-.82.19-1.6.49-2.33.87l2.12 2.12c.82-.32 1.69-.51 2.6-.54L20 24l2-2L2 0z"/></svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>No fue posible cargar la página. Verifica tu conexión e inténtalo de nuevo.</p>
    <p>Si ya visitaste esta página antes, parte del contenido podría estar disponible.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
