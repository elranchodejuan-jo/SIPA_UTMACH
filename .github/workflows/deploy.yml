name: Validar y publicar SIPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar portal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar JavaScript
        run: npm run check:js

      - name: Construir portal y Expoferia
        run: npm run build

      - name: Validar sitio generado
        run: npm run check:site

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Conservar artefacto validado para Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sipa-dist-${{ github.sha }}
          path: ./dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar artefacto validado
        uses: actions/download-artifact@v4
        with:
          name: sipa-dist-${{ github.sha }}
          path: ./dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
