<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" fill="none">
  <rect width="1920" height="900" fill="#143B63"/>
  <rect x="0" y="0" width="1920" height="900" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143B63"/>
      <stop offset="50%" stop-color="#1a4d7a"/>
      <stop offset="100%" stop-color="#3478A8"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>
  <rect width="1920" height="900" fill="url(#dots)"/>
  <!-- Grain/corn decorative shapes -->
  <ellipse cx="1500" cy="350" rx="120" ry="180" fill="rgba(213,167,45,0.12)" transform="rotate(-15 1500 350)"/>
  <ellipse cx="1650" cy="500" rx="80" ry="130" fill="rgba(92,141,72,0.1)" transform="rotate(10 1650 500)"/>
  <circle cx="1400" cy="600" r="60" fill="rgba(255,255,255,0.04)"/>
  <!-- Placeholder text -->
  <text x="960" y="420" font-family="system-ui, sans-serif" font-size="48" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="600">Fotografía de portada</text>
  <text x="960" y="480" font-family="system-ui, sans-serif" font-size="24" fill="rgba(255,255,255,0.2)" text-anchor="middle">1920 × 900 px · WebP recomendado</text>
</svg>
